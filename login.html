<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MME - Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="seguridad.js"></script>
    
    <style>
        :root {
            --p-surface: #ffffff; --p-background: #f4f6f8; --p-text: #202223; --p-text-subdued: #6d7175;
            --p-border: #c9cccf; --p-action-primary: #1e293b; --p-action-primary-hover: #0f172a;
            --p-interactive: #2c6ecb; --p-critical: #d82c0d; --p-shadow-card: 0 10px 25px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body { background-color: var(--p-background); color: var(--p-text); height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #1e293b 0%, #1e293b 40%, #f4f6f8 40%, #f4f6f8 100%); }
        .login-container { width: 100%; max-width: 420px; padding: 20px; z-index: 10; }
        .login-card { background: var(--p-surface); border-radius: 12px; box-shadow: var(--p-shadow-card); overflow: hidden; }
        .login-header { padding: 40px 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .logo-circle { width: 64px; height: 64px; background: var(--p-background); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--p-action-primary); border: 2px solid var(--p-border); }
        .login-header h1 { font-size: 22px; font-weight: 800; color: var(--p-action-primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .login-header p { font-size: 14px; color: var(--p-text-subdued); }
        .login-body { padding: 0 30px 40px; }
        .polaris-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;}
        .polaris-label { font-size: 13px; font-weight: 600; color: var(--p-text); text-transform: uppercase; letter-spacing: 0.5px;}
        .polaris-input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        .prefix { position: absolute; left: 12px; color: var(--p-text-subdued); font-size: 18px; }
        .has-prefix { padding-left: 40px !important; }
        .polaris-input { width: 100%; padding: 10px 12px; border: 1px solid var(--p-border); border-radius: 6px; font-size: 15px; color: var(--p-text); background-color: var(--p-surface); transition: border-color 0.2s, box-shadow 0.2s; height: 44px; }
        .polaris-input:focus { outline: none; border-color: var(--p-interactive); box-shadow: 0 0 0 2px rgba(44, 110, 203, 0.2); }
        .action-icon { position: absolute; right: 4px; background: none; border: none; color: var(--p-text-subdued); cursor: pointer; padding: 8px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .action-icon:hover { color: var(--p-action-primary); }
        .polaris-btn-primary { background-color: var(--p-action-primary); color: white; border: 1px solid transparent; padding: 12px 24px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; letter-spacing: 0.5px; margin-top: 10px; }
        .polaris-btn-primary:hover { background-color: var(--p-action-primary-hover); box-shadow: 0 4px 8px rgba(30, 41, 59, 0.2); }
        .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--p-text-subdued); }
        .login-footer strong { color: var(--p-text); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32, 34, 35, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; animation: fadeIn 0.2s forwards; }
        .modal-content { background: var(--p-surface); width: 90%; max-width: 350px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; transform: scale(0.95); animation: scaleUp 0.2s forwards; text-align: center; }
        .modal-header { padding: 24px 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 18px; font-weight: 700;}
        .modal-body { padding: 0 24px 20px; color: var(--p-text-subdued); font-size: 14px; line-height: 1.5; }
        .modal-footer { padding: 16px 20px; background: #fafbfb; border-top: 1px solid var(--p-border); display: flex; justify-content: center;}
        .modal-header.error { color: var(--p-critical); }
        .modal-header.warning { color: #b98900; }
        .modal-header .material-icons-outlined { font-size: 40px; margin-bottom: 5px;}
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scaleUp { to { transform: scale(1); } }
        .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-circle">
                    <span class="material-icons-outlined" style="font-size: 32px; color: #108043;">admin_panel_settings</span>
                </div>
                <h1>Acceso al Sistema</h1>
                <p>Ingrese sus credenciales corporativas</p>
            </div>

            <div class="login-body">
                <form id="form-login" onsubmit="event.preventDefault(); procesarLogin();">
                    <div class="polaris-field">
                        <label class="polaris-label">Usuario (DNI)</label>
                        <div class="polaris-input-wrapper">
                            <span class="material-icons-outlined prefix">badge</span>
                            <input type="text" id="in-dni" class="polaris-input has-prefix" placeholder="Ingrese su DNI" required maxlength="8" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                    </div>

                    <div class="polaris-field">
                        <label class="polaris-label">Contraseña</label>
                        <div class="polaris-input-wrapper">
                            <span class="material-icons-outlined prefix">lock</span>
                            <input type="password" id="in-password" class="polaris-input has-prefix" placeholder="••••••••" required style="padding-right: 40px;">
                            <button type="button" class="action-icon" onclick="togglePassword()" tabindex="-1">
                                <span class="material-icons-outlined" id="icon-pass" style="font-size: 20px;">visibility</span>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="polaris-btn-primary" id="btn-ingresar">
                        <span id="btn-text">INGRESAR</span>
                        <div class="loader" id="btn-loader"></div>
                    </button>
                </form>
            </div>
        </div>

        <div class="login-footer">
            &copy; 2026 <strong>M.E.F. ENGINEERING & HSSE SOLUTIONS</strong><br>
            Plataforma de Gestión Empresarial
        </div>
    </div>

    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="alerta-header">
                <span class="material-icons-outlined" id="alerta-icon">error</span>
                <span id="alerta-titulo">Atención</span>
            </div>
            <div class="modal-body" id="alerta-mensaje">Mensaje de error aquí.</div>
            <div class="modal-footer">
                <button class="polaris-btn-primary" style="width: 100%; justify-content: center; height: 40px;" onclick="cerrarAlerta()">Reintentar</button>
            </div>
        </div>
    </div>

<script>
    // 1. INICIALIZAR FIREBASE CON TUS LLAVES MAESTRAS
    const firebaseConfig = {
        apiKey: "AIzaSyBkF4sLasIwUXH8hXSDTVbl1pXcUfHsGHg",
        authDomain: "pos-mef-ventas.firebaseapp.com",
        projectId: "pos-mef-ventas",
        storageBucket: "pos-mef-ventas.firebasestorage.app",
        messagingSenderId: "704671042289",
        appId: "1:704671042289:web:3f3b78992eb2863e25f750"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. CREACIÓN AUTOMÁTICA DEL GERENTE AL CARGAR
    window.onload = async () => {
        document.getElementById('in-dni').focus();
        localStorage.removeItem('isa_sesion'); 

        try {
            const adminRef = db.collection('usuarios').doc('USR-MASTER');
            const doc = await adminRef.get();
            
            if (!doc.exists) {
                await adminRef.set({
                    id: "USR-MASTER",
                    dni: "73372032",
                    nombre: "MAX TAYSON MENDOZA ACUÑA",
                    rol: "Gerente",
                    celular: "978536345",
                    estado: "Activo",
                    password: "C8KM1Y0F1I3K1S6H.&#*",
                    fechaRegistro: new Date().toISOString()
                });
                console.log("¡Usuario Gerente sincronizado en la nube con éxito!");
            }
        } catch (error) {
            console.error("Error conectando a Firebase.", error);
        }
    };

    function mostrarAlerta(titulo, mensaje, tipo = 'error') {
        const modal = document.getElementById('modal-alerta');
        const header = document.getElementById('alerta-header');
        const icon = document.getElementById('alerta-icon');
        
        document.getElementById('alerta-titulo').innerText = titulo;
        document.getElementById('alerta-mensaje').innerText = mensaje;
        header.className = 'modal-header'; 
        if(tipo === 'error') { header.classList.add('error'); icon.innerText = 'gpp_bad'; } 
        else if (tipo === 'warning') { header.classList.add('warning'); icon.innerText = 'warning'; }
        modal.style.display = 'flex';
    }

    function cerrarAlerta() {
        document.getElementById('modal-alerta').style.display = 'none';
        document.getElementById('in-password').value = ''; 
        document.getElementById('in-password').focus();
    }

    function togglePassword() {
        const passInput = document.getElementById('in-password');
        const iconPass = document.getElementById('icon-pass');
        if (passInput.type === 'password') {
            passInput.type = 'text'; iconPass.innerText = 'visibility_off'; iconPass.style.color = 'var(--p-interactive)'; 
        } else {
            passInput.type = 'password'; iconPass.innerText = 'visibility'; iconPass.style.color = 'var(--p-text-subdued)';
        }
    }

    // 3. LÓGICA DE LOGIN CONECTADA A LA NUBE
    async function procesarLogin() {
        const dniInput = document.getElementById('in-dni').value.trim();
        const passInput = document.getElementById('in-password').value.trim();
        const btnIngresar = document.getElementById('btn-ingresar');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        if (!dniInput || !passInput) {
            return mostrarAlerta('Datos Incompletos', 'Debe ingresar su usuario (DNI) y su contraseña.', 'warning');
        }

        let bloqueos = JSON.parse(localStorage.getItem('isa_seguridad_bloqueos')) || {};
        let tiempoActual = new Date().getTime();

        if (bloqueos[dniInput] && bloqueos[dniInput].bloqueadoHasta > tiempoActual) {
            let faltanMinutos = Math.ceil((bloqueos[dniInput].bloqueadoHasta - tiempoActual) / 60000);
            return mostrarAlerta('Acceso Bloqueado', `Intente nuevamente en ${faltanMinutos} minuto(s).`, 'error');
        }

        btnText.style.display = 'none';
        btnLoader.style.display = 'block';
        btnIngresar.disabled = true;

        try {
            const snapshot = await db.collection('usuarios').where('dni', '==', dniInput).get();

            if (snapshot.empty) {
                restaurarBoton();
                return mostrarAlerta('Acceso Denegado', 'El DNI ingresado no existe en los registros.', 'error');
            }

            let usuarioEncontrado = null;
            snapshot.forEach(doc => { usuarioEncontrado = doc.data(); });

            if (usuarioEncontrado.password !== passInput) {
                restaurarBoton();
                if (!bloqueos[dniInput]) bloqueos[dniInput] = { intentos: 0, bloqueadoHasta: 0 };
                bloqueos[dniInput].intentos += 1;

                if (bloqueos[dniInput].intentos >= 3) {
                    bloqueos[dniInput].bloqueadoHasta = tiempoActual + (5 * 60 * 1000);
                    localStorage.setItem('isa_seguridad_bloqueos', JSON.stringify(bloqueos));
                    return mostrarAlerta('Seguridad Activada', 'Bloqueado por 5 minutos debido a 3 intentos fallidos.', 'error');
                } else {
                    localStorage.setItem('isa_seguridad_bloqueos', JSON.stringify(bloqueos));
                    let intRestantes = 3 - bloqueos[dniInput].intentos;
                    return mostrarAlerta('Acceso Denegado', `Contraseña incorrecta. Quedan ${intRestantes} intento(s).`, 'error');
                }
            }

            if (usuarioEncontrado.estado === 'Inactivo') {
                restaurarBoton();
                return mostrarAlerta('Cuenta Suspendida', 'Comuníquese con gerencia.', 'warning');
            }

            if (bloqueos[dniInput]) {
                delete bloqueos[dniInput];
                localStorage.setItem('isa_seguridad_bloqueos', JSON.stringify(bloqueos));
            }

            localStorage.setItem('isa_sesion', JSON.stringify({
                id: usuarioEncontrado.id,
                dni: usuarioEncontrado.dni,
                nombre: usuarioEncontrado.nombre,
                rol: usuarioEncontrado.rol
            }));

            if (usuarioEncontrado.rol === 'Vendedor') {
                window.location.href = 'RegistroSalidas.html';
            } else {
                window.location.href = 'Control.html';
            }

        } catch (error) {
            restaurarBoton();
            mostrarAlerta('Fallo de Conexión', 'No se pudo contactar con la nube. Revise su internet.', 'error');
            console.error(error);
        }

        function restaurarBoton() {
            btnText.style.display = 'block';
            btnLoader.style.display = 'none';
            btnIngresar.disabled = false;
        }
    }
</script>
</body>
</html>
